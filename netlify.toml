[build]
  publish = "."
  functions = "netlify/functions"

# picks up any ticket whose 5 minutes ran out while the app was closed
[functions."sweep"]
  schedule = "* * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
