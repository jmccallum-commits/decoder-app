<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decoder — posts, explained</title>
<meta name="description" content="Send a post. Get it explained.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Karla:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151125; --ink-2:#1D1832; --stub:#241E3D; --edge:#332B54;
    --bone:#EFEAF7; --bone-dim:#9E95BC;
    --amber:#FFB43D; --mint:#79E2C0; --red:#FF7A6B;
    --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
    --body:"Karla","Helvetica Neue",Arial,sans-serif;
    --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);color:var(--bone);font-family:var(--body);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 96px;
    background-image:radial-gradient(120% 60% at 50% -10%, #2A2148 0%, var(--ink) 62%);
    background-attachment:fixed;
  }
  .wrap{max-width:620px;margin:0 auto;padding:0 18px}
  header{padding:26px 0 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .mark{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1;margin:0}
  .mark span{color:var(--amber)}
  .tag{font-family:var(--mono);font-size:11px;color:var(--bone-dim);margin-top:7px}
  .switch{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    background:none;border:1px solid var(--edge);color:var(--bone-dim);
    padding:8px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;flex:none}
  .switch:hover{color:var(--bone);border-color:var(--bone-dim)}
  .panel{background:var(--ink-2);border:1px solid var(--edge);border-radius:16px;padding:18px;margin-bottom:26px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);margin:0 0 10px}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim);margin:0 0 6px}
  input[type=text],input[type=url],input[type=email],input[type=password],textarea{
    width:100%;background:#120F1F;border:1px solid var(--edge);border-radius:10px;
    color:var(--bone);font-family:var(--body);font-size:16px;padding:12px 13px;resize:vertical}
  input::placeholder,textarea::placeholder{color:#6B6288}
  input:focus,textarea:focus,button:focus-visible,.drop:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .field{margin-bottom:14px}
  .drop{border:1px dashed var(--edge);border-radius:12px;background:#120F1F;padding:20px 14px;text-align:center;
    cursor:pointer;display:block;width:100%;color:var(--bone-dim);font-size:14px}
  .drop strong{display:block;color:var(--bone);font-size:15px;margin-bottom:3px}
  .drop.on{border-color:var(--amber);color:var(--bone)}
  .thumb{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--edge)}
  .thumb img{display:block;width:100%}
  .thumb button{position:absolute;top:8px;right:8px;background:rgba(10,8,18,.82);border:1px solid var(--edge);
    color:var(--bone);border-radius:999px;padding:5px 11px;font-family:var(--mono);font-size:11px;cursor:pointer}
  .go{width:100%;background:var(--amber);color:#241703;border:0;border-radius:11px;
    font-family:var(--display);font-weight:800;font-size:17px;padding:15px;cursor:pointer}
  .go:disabled{opacity:.45;cursor:default}
  .note{font-family:var(--mono);font-size:11px;color:var(--bone-dim);margin-top:10px;line-height:1.6}
  .err{color:var(--red);font-family:var(--mono);font-size:12px;margin-top:10px}
  h2.sec{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);
    font-weight:400;margin:0 0 12px;display:flex;align-items:center;gap:10px}
  h2.sec:after{content:"";flex:1;height:1px;background:var(--edge)}
  .ticket{background:var(--stub);border:1px solid var(--edge);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .t-top{padding:14px 16px 13px}
  .t-num{font-family:var(--mono);font-size:11px;color:var(--bone-dim);letter-spacing:.08em;
    display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}
  .t-q{font-size:16px;margin:0 0 10px;word-wrap:break-word;overflow-wrap:anywhere}
  .t-link{font-family:var(--mono);font-size:12px;color:var(--amber);text-decoration:none;word-break:break-all;
    display:inline-block;margin-bottom:10px}
  .t-media{border-radius:9px;overflow:hidden;border:1px solid var(--edge);margin-bottom:10px;background:#120F1F}
  .t-media img{display:block;width:100%}
  .t-media .ph{padding:22px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--bone-dim)}
  .perf{height:1px;background-image:linear-gradient(90deg,var(--edge) 0 6px,transparent 6px 12px);
    background-size:12px 1px;position:relative}
  .perf:before,.perf:after{content:"";position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;
    background:var(--ink);border:1px solid var(--edge)}
  .perf:before{left:-9px}.perf:after{right:-9px}
  .t-bot{padding:13px 16px 15px}
  .meter-lab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--bone-dim);margin-bottom:7px}
  .meter-lab b{color:var(--amber);font-weight:500}
  .bar{height:3px;background:#171227;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--amber);transition:width 1s linear}
  .bar.late i{background:var(--mint)}
  .answer .who{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .human .dot{background:var(--amber)} .human .who{color:var(--amber)}
  .robot .dot{background:var(--mint)} .robot .who{color:var(--mint)}
  .answer p{margin:0;white-space:pre-wrap;word-wrap:break-word}
  .answer.robot p{color:#DDF6EE}
  .pending-note{font-family:var(--mono);font-size:11px;color:var(--bone-dim);margin-top:9px}
  .thread{margin-top:14px;border-top:1px solid var(--edge);padding-top:13px}
  .modes{display:flex;gap:8px;margin-bottom:16px}
  .mode{flex:1;background:#120F1F;border:1px solid var(--edge);color:var(--bone-dim);
    border-radius:10px;padding:11px 8px;cursor:pointer;
    font-family:var(--body);font-size:14px;font-weight:600}
  .mode.on{background:var(--amber);border-color:var(--amber);color:#241703}
  .mode.on.mint{background:var(--mint);border-color:var(--mint);color:#0C2B22}
  .tag-ai{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--mint);border:1px solid #2E5A4B;
    border-radius:999px;padding:3px 8px;margin-bottom:9px}
  .msg{margin-bottom:11px;padding:10px 12px;border-radius:11px;background:#1B1630;border:1px solid var(--edge)}
  .msg.from-desk{background:#2A2033;border-color:#4A3A22}
  .msg-who{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone-dim);margin-bottom:5px}
  .msg.from-desk .msg-who{color:var(--amber)}
  .msg p{margin:0;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
  .empty{border:1px dashed var(--edge);border-radius:14px;padding:26px 18px;text-align:center;
    color:var(--bone-dim);font-family:var(--mono);font-size:12px;line-height:1.7}
  .send{background:none;border:1px solid var(--amber);color:var(--amber);border-radius:9px;
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 14px;cursor:pointer;margin-top:9px;width:100%}
  .send:hover{background:var(--amber);color:#241703}
  .mini{background:none;border:1px solid var(--edge);color:var(--bone-dim);border-radius:8px;
    font-family:var(--mono);font-size:11px;padding:7px 11px;cursor:pointer;margin-top:9px}
  .mini:hover{color:var(--bone)}
  footer{text-align:center;font-family:var(--mono);font-size:11px;color:#5C5480;padding:30px 0 0;line-height:1.8}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ================= MOMO ================= */
  .momo-dock{height:118px;display:grid;place-items:center;margin:2px 0 10px}
  .momo-cap{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--bone-dim);
    text-align:center;margin-top:-4px;margin-bottom:14px}
  .momo{position:relative;width:150px;height:150px;transform:scale(.62);transform-origin:50% 60%}
  .momo *{box-sizing:border-box}
  .momo .tail{position:absolute;bottom:8px;right:-40px;width:52px;height:96px;z-index:1;
    transform-origin:14% 90%;transform:rotate(16deg)}
  .momo .tail .base{position:absolute;inset:0;background:#F08A3C;border:4px solid #2A1710;
    border-radius:26px;overflow:hidden;display:block}
  .momo .tail .st{position:absolute;left:-4px;right:-4px;height:15px;background:#5C3620;display:block}
  .momo .tail .st1{bottom:8px}.momo .tail .st2{bottom:36px}.momo .tail .st3{bottom:64px}
  .momo .bod{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:104px;height:70px;background:#7A4A2B;border:4px solid #2A1710;
    border-radius:44px 44px 30px 30px;z-index:2}
  .momo .paw{position:absolute;bottom:-2px;width:34px;height:22px;background:#7A4A2B;
    border:4px solid #2A1710;border-radius:16px 16px 12px 12px;z-index:5}
  .momo .paw.l{left:22px}.momo .paw.r{right:22px}
  .momo .paw i{position:absolute;top:2px;left:50%;transform:translateX(-50%);
    width:18px;height:8px;border-radius:9px;background:#D96F26;opacity:.55}
  .momo .ear{position:absolute;top:-4px;width:44px;height:44px;background:#F08A3C;
    border:4px solid #2A1710;border-radius:56% 56% 10px 56%;z-index:2}
  .momo .ear.l{left:8px;transform:rotate(-32deg)}
  .momo .ear.r{right:8px;transform:rotate(32deg) scaleX(-1)}
  .momo .ear i{position:absolute;left:8px;top:10px;width:22px;height:22px;background:#FFFDF9;
    border-radius:56% 56% 6px 56%}
  .momo .hed{position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:136px;height:112px;background:#F08A3C;border:4px solid #2A1710;
    border-radius:52% 52% 46% 46%;z-index:3}
  .momo .patch{position:absolute;top:52px;width:44px;height:46px;background:#5C3620;
    border-radius:50%;z-index:4}
  .momo .patch.l{left:8px}.momo .patch.r{right:8px}
  .momo .muzzle{position:absolute;left:50%;top:48px;transform:translateX(-50%);
    width:74px;height:56px;background:#FFFDF9;border-radius:48% 48% 50% 50%;z-index:5}
  .momo .brow{position:absolute;top:30px;width:16px;height:8px;background:#FFFDF9;
    border-radius:8px;z-index:6}
  .momo .brow.l{left:36px;transform:rotate(-8deg)}.momo .brow.r{right:36px;transform:rotate(8deg)}
  .momo .face{position:absolute;inset:0;z-index:7}
  .momo .eye{position:absolute;top:42px;width:24px;height:24px;border-radius:50%;
    background:#FFF;border:3px solid #2A1710}
  .momo .eye.l{left:28px}.momo .eye.r{right:28px}
  .momo .iris{position:absolute;top:47px;width:15px;height:15px;border-radius:50%;background:#2A1710}
  .momo .iris.l{left:33px}.momo .iris.r{right:33px}
  .momo .shn{position:absolute;border-radius:50%;background:#FFF;z-index:8}
  .momo .shn.a{width:6px;height:6px;top:49px}.momo .shn.b{width:3px;height:3px;top:56px}
  .momo .shn.la{left:36px}.momo .shn.lb{left:43px}
  .momo .shn.ra{right:41px}.momo .shn.rb{right:34px}
  .momo .arc{position:absolute;top:48px;width:22px;height:12px;opacity:0;
    border:0;border-top:5px solid #2A1710;border-radius:22px 22px 0 0}
  .momo .arc.l{left:29px}.momo .arc.r{right:29px}
  .momo .lash{position:absolute;top:54px;width:20px;height:10px;opacity:0;
    border:0;border-bottom:4px solid #2A1710;border-radius:0 0 20px 20px}
  .momo .lash.l{left:30px}.momo .lash.r{right:30px}
  .momo .blush{position:absolute;top:66px;width:17px;height:9px;border-radius:50%;
    background:#F2A0BA;opacity:0;transition:opacity .4s;z-index:8}
  .momo .blush.l{left:18px}.momo .blush.r{right:18px}
  .momo .nose{position:absolute;top:62px;left:50%;transform:translateX(-50%);
    width:15px;height:11px;background:#2A1710;border-radius:45% 45% 60% 60%;z-index:9}
  .momo .nose i{position:absolute;top:2px;left:2.5px;width:5px;height:3.5px;
    border-radius:50%;background:#6B4A38}
  .momo .smile{position:absolute;top:73px;left:50%;transform:translateX(-50%);
    width:14px;height:10px;background:#4A2418;border:2.2px solid #2A1710;
    border-radius:4px 4px 12px 12px;overflow:hidden;z-index:9;transform-origin:50% 0}
  .momo .smile i{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
    width:10px;height:6.5px;border-radius:50% 50% 0 0;background:#F2A0BA}
  .momo .curl{position:absolute;top:72px;width:5px;height:5px;border:0;
    border-top:2.2px solid #2A1710;border-radius:5px 5px 0 0;z-index:9}
  .momo .curl.l{left:calc(50% - 12px);transform:rotate(-18deg)}
  .momo .curl.r{right:calc(50% - 12px);transform:rotate(18deg)}
  .momo .zzz{position:absolute;top:-14px;right:2px;font-family:var(--mono);
    font-size:17px;font-weight:600;color:var(--amber);opacity:0;z-index:10}
  .momo.happy{animation:mo-hop 1.7s ease-in-out infinite}
  .momo.happy .eye,.momo.happy .iris,.momo.happy .shn{opacity:0}
  .momo.happy .arc{opacity:1}
  .momo.happy .blush{opacity:.8}
  .momo.happy .smile{transform:translateX(-50%) scale(1.2)}
  .momo.happy .tail{animation:mo-wag 1.7s ease-in-out infinite}
  .momo.happy .paw.l{animation:mo-pawl 1.7s ease-in-out infinite}
  .momo.happy .paw.r{animation:mo-pawr 1.7s ease-in-out infinite}
  .momo.drowsy{animation:mo-breathe 3.2s ease-in-out infinite}
  .momo.drowsy .eye,.momo.drowsy .iris,.momo.drowsy .shn{opacity:0}
  .momo.drowsy .lash{opacity:1}
  .momo.drowsy .blush{opacity:.6}
  .momo.drowsy .curl{opacity:0}
  .momo.drowsy .smile{transform:translateX(-50%) scale(.75)}
  .momo.drowsy .ear.l{transform:rotate(-40deg) translateY(2px)}
  .momo.drowsy .ear.r{transform:rotate(40deg) scaleX(-1) translateY(2px)}
  .momo.sleepy{animation:mo-breathe 3.8s ease-in-out infinite}
  .momo.sleepy .eye,.momo.sleepy .iris,.momo.sleepy .shn{opacity:0}
  .momo.sleepy .lash{opacity:1}
  .momo.sleepy .blush{opacity:.55}
  .momo.sleepy .curl{opacity:0}
  .momo.sleepy .smile{animation:mo-puff 3.8s ease-in-out infinite}
  .momo.sleepy .ear.l{transform:rotate(-48deg) translateY(4px)}
  .momo.sleepy .ear.r{transform:rotate(48deg) scaleX(-1) translateY(4px)}
  .momo.sleepy .tail{transform:rotate(58deg) translateX(-26px)}
  .momo.sleepy .zzz{animation:mo-zzz 3.8s ease-in-out infinite}
  .momo.waking{animation:mo-startle 1s cubic-bezier(.34,1.56,.64,1) 1}
  .momo.waking .lash{opacity:0}
  .momo.waking .eye,.momo.waking .iris,.momo.waking .shn{opacity:1;
    animation:mo-popin .45s cubic-bezier(.34,1.56,.64,1) 1}
  .momo.waking .blush{opacity:.65}
  .momo.waking .ear.l{animation:mo-earpl .8s ease-out 1 forwards}
  .momo.waking .ear.r{animation:mo-earpr .8s ease-out 1 forwards}
  .momo.waking .tail{animation:mo-tailup .8s ease-out 1 forwards}
  .momo.reading{animation:mo-study 3.6s ease-in-out infinite}
  .momo.reading .eye,.momo.reading .iris,.momo.reading .shn{opacity:1}
  .momo.reading .blush{opacity:.65}
  .momo.reading .tail{animation:mo-swish 3.6s ease-in-out infinite}
  .momo.reading .paw.r{animation:mo-tap 1.2s ease-in-out infinite}
  .momo.reading .iris{animation:mo-scan 3.6s ease-in-out infinite}
  @keyframes mo-hop{0%,100%{transform:scale(.62) translateY(0)}
    36%{transform:scale(.62) translateY(-12px) rotate(-2deg)}
    58%{transform:scale(.65,.59) translateY(0)}72%{transform:scale(.62)}}
  @keyframes mo-wag{0%,100%{transform:rotate(10deg)}45%{transform:rotate(32deg)}}
  @keyframes mo-pawl{0%,100%{transform:rotate(0) translateY(0)}38%{transform:rotate(-14deg) translateY(-4px)}}
  @keyframes mo-pawr{0%,100%{transform:rotate(0) translateY(0)}38%{transform:rotate(14deg) translateY(-4px)}}
  @keyframes mo-breathe{0%,100%{transform:scale(.62)}50%{transform:scale(.64,.6)}}
  @keyframes mo-puff{0%,100%{transform:translateX(-50%) scale(.62)}50%{transform:translateX(-50%) scale(.74)}}
  @keyframes mo-zzz{0%{opacity:0;transform:translate(0,7px) scale(.7)}
    28%{opacity:.95}72%,100%{opacity:0;transform:translate(12px,-20px) scale(1.2)}}
  @keyframes mo-startle{0%{transform:scale(.62)}
    28%{transform:scale(.58,.68) translateY(-17px) rotate(3deg)}
    56%{transform:scale(.67,.57) translateY(0)}
    78%{transform:scale(.62) translateY(-4px)}100%{transform:scale(.62) translateY(0)}}
  @keyframes mo-popin{0%{transform:scale(.2)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes mo-earpl{0%{transform:rotate(-48deg) translateY(4px)}
    55%{transform:rotate(-22deg)}100%{transform:rotate(-32deg)}}
  @keyframes mo-earpr{0%{transform:rotate(48deg) scaleX(-1) translateY(4px)}
    55%{transform:rotate(22deg) scaleX(-1)}100%{transform:rotate(32deg) scaleX(-1)}}
  @keyframes mo-tailup{0%{transform:rotate(58deg) translateX(-26px)}
    60%{transform:rotate(4deg)}100%{transform:rotate(16deg)}}
  @keyframes mo-study{0%,100%{transform:scale(.62) rotate(-6deg)}50%{transform:scale(.62) rotate(7deg)}}
  @keyframes mo-swish{0%,100%{transform:rotate(8deg)}50%{transform:rotate(24deg)}}
  @keyframes mo-tap{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px)}}
  @keyframes mo-scan{0%,100%{transform:translateX(0)}30%{transform:translateX(2.5px)}65%{transform:translateX(-2.5px)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="mark">DE<span>CODER</span></h1>
      <div class="tag" id="tagline">starting up…</div>
    </div>
    <button class="switch" id="modeBtn">The desk</button>
  </header>
  <main id="app"><div class="empty">Connecting…</div></main>
  <footer>Human first. Machine after five minutes.<br><span id="clock"></span></footer>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ======================= FILL THESE IN ======================= */
const SUPABASE_URL      = 'https://ifvrfhiqdwyzbwiohlmn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_GbAfD8pEHR8qIZ26msfFQw_9vCfaAay';
/* ============================================================= */

const GRACE_MS  = 5 * 60 * 1000;
const MAX_EDGE  = 1100;
const OWNER_NAME = 'the explainer';
const EXPLAIN_URL = '/.netlify/functions/explain';
const CHAT_URL = '/.netlify/functions/chat';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const state = { rows:[], msgs:[], me:null, admin:false, mode:'ask', ask:'explain', who:'human', draft:null, busy:false, error:'', poked:{}, linkSent:null };
window.setAsk = v => { state.ask = v; state.error=''; render(); };
window.setWho = v => { state.who = v; state.error=''; render(); };

/* ---------------- momo ---------------- */
let momoBusyUntil = 0;
function momoIdleState(){
  const h = new Date().getHours();
  if(h >= 22 || h < 6) return 'sleepy';   // in bed 10pm–6am
  if(h >= 21) return 'drowsy';            // winding down from 9pm
  return 'happy';
}
function momoCaption(s){
  return {
    happy: "momo's up",
    drowsy: 'getting ready for bed…',
    sleepy: "asleep — send something and he'll wake up",
    waking: '…hm?!',
    reading: 'momo is reading it…'
  }[s];
}
function momoSet(s){
  const e = document.getElementById('momoEl');
  const c = document.getElementById('momoCap');
  if(e) e.className = 'momo ' + s;
  if(c) c.textContent = momoCaption(s);
}
function momoRefresh(){
  if(Date.now() < momoBusyUntil) return;
  momoSet(momoIdleState());

/* signed links, one hour each, re-signed a few minutes before they lapse */
const SIGN_SECONDS = 3600;
const signCache = new Map();
async function signedURL(path){
  const hit = signCache.get(path);
  if(hit && hit.exp - Date.now() > 5*60*1000) return hit.url;
  const { data, error } = await sb.storage.from('posts').createSignedUrl(path, SIGN_SECONDS);
  if(error || !data){ return null; }
  signCache.set(path, { url: data.signedUrl, exp: Date.now() + SIGN_SECONDS*1000 });
  return data.signedUrl;
}
async function fillMedia(){
  await Promise.all(state.rows.filter(t => t.media_path).map(async t => {
    const slot = document.getElementById('m_' + t.id);
    if(!slot || slot.dataset.done) return;
    const url = await signedURL(t.media_path);
    const live = document.getElementById('m_' + t.id);
    if(!live) return;
    live.dataset.done = '1';
    live.innerHTML = url
      ? `<img loading="lazy" src="${url}" alt="Submitted post">`
      : `<div class="ph">that image is not available</div>`;
  }));
}
function agoStr(ts){
  const m = Math.floor((Date.now() - new Date(ts).getTime())/60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + ' min ago';
  const h = Math.floor(m/60); if(h < 24) return h + 'h ago';
  return Math.floor(h/24) + 'd ago';
}

  sb.channel('tickets-live')
    .on('postgres_changes', { event:'*', schema:'public', table:'tickets' }, () => load(true))
    .on('postgres_changes', { event:'*', schema:'public', table:'messages' }, () => load(true))

})();

async function load(quiet){
  const { data, error } = await sb.from('tickets').select('*').order('created_at', { ascending:false }).limit(200);
  if(error){ console.error(error); return; }
  state.rows = data || [];
  const { data: msgs } = await sb.from('messages').select('*').order('created_at', { ascending:true }).limit(1000);
  state.msgs = msgs || [];
  // a background poll should not yank the page out from under someone typing
  const a = document.activeElement;
  const typing = a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') && a.value;

}

function tick(){

    const left = +el.dataset.due - Date.now();
    const lab = el.querySelector('.meter-lab'), bar = el.querySelector('.bar'), fill = el.querySelector('.bar i');
    if(left > 0){

    }else{

      bar.classList.add('late'); fill.style.width = '100%';
    }
  });

function nudgeOverdue(){
  const now = Date.now();
  for(const t of state.rows){
    if(t.status !== 'open') continue;
    if(now - new Date(t.created_at).getTime() < GRACE_MS) continue;
    if(state.poked[t.id] && now - state.poked[t.id] < 90000) continue;
    state.poked[t.id] = now;
    fetch(EXPLAIN_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ id:t.id }) })
      .catch(e => console.error('explain call failed', e));
  }
}

/* ------------------------- media ------------------------- */
function fileToImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('That image would not open.')); im.src = fr.result; };
    fr.onerror = () => rej(new Error('That file would not read.'));
    fr.readAsDataURL(file);
  });
}
const canvasToBlob = c => new Promise(r => c.toBlob(r, 'image/jpeg', .78));
async function shrink(img){
  const sc = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function videoStrip(file){
  return new Promise((res, rej) => {
    const v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true; v.playsInline = true;
    v.src = URL.createObjectURL(file);
    v.onerror = () => rej(new Error('That video would not open. Paste the link instead.'));
    v.onloadedmetadata = () => {
      const marks = [.12,.5,.85].map(p => Math.max(.05, v.duration*p));
      const w = 640, h = Math.round(640 * ((v.videoHeight/v.videoWidth) || .56));
      const c = document.createElement('canvas'); c.width = w; c.height = h*3;
      const cx = c.getContext('2d');
      let i = 0;
      const next = () => { if(i >= marks.length){ URL.revokeObjectURL(v.src); return res(c); } v.currentTime = marks[i]; };
      v.onseeked = () => { cx.drawImage(v, 0, h*i, w, h); i++; next(); };
      next();
    };
    setTimeout(() => rej(new Error('That video took too long. Paste the link instead.')), 20000);
  });
}
async function pickFile(file){
  state.error = '';
  if(!file) return;
  try{
    state.busy = true; render();
    let canvas;
    if(file.type.startsWith('video/')) { canvas = await videoStrip(file); state.draft = { kind:'video' }; }
    else if(file.type.startsWith('image/')) { canvas = await shrink(await fileToImage(file)); state.draft = { kind:'image' }; }
    else { state.error = 'Images and videos only.'; state.busy = false; return render(); }
    state.draft.blob = await canvasToBlob(canvas);
    state.draft.preview = canvas.toDataURL('image/jpeg', .6);
  }catch(e){ state.error = e.message; state.draft = null; }
  state.busy = false; render();
}

async function submit(){
  const link = document.getElementById('link').value.trim();
  const question = document.getElementById('q').value.trim();
  const handle = document.getElementById('handle').value.trim();
  if(!link && !state.draft){ state.error = 'Add a screenshot so there is something to read.'; return render(); }
  if(state.ask === 'ai_check' && !state.draft){ state.error = 'AI checks need the actual image — a link will not do it.'; return render(); }
  if(link && !/^https?:\/\//i.test(link)){ state.error = 'Links need to start with http:// or https://'; return render(); }

  state.busy = true; state.error = ''; render();
  let media_path = null;
  try{
    if(state.draft){
      media_path = `${state.me}/${crypto.randomUUID()}.jpg`;
      const { error } = await sb.storage.from('posts').upload(media_path, state.draft.blob, { contentType:'image/jpeg' });
      if(error) throw new Error('The upload did not go through. Try a smaller file.');
    }
    const { data: made, error } = await sb.from('tickets').insert({
      owner: state.me, handle: handle.slice(0,40), question: question.slice(0,400),
      link: link.slice(0,500), kind: state.draft ? state.draft.kind : 'link', media_path,
      ask_type: state.ask, answer_by: state.who
    }).select('id').single();
    if(error) throw new Error('The ticket did not save. Try again.');
    if(state.who === 'ai_now' && made){
      momoRead();
      fetch(EXPLAIN_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ id: made.id }) })
        .then(() => setTimeout(load, 1500))
        .catch(e => console.error('explain call failed', e));
    }
    state.draft = null;
  }catch(e){ state.error = e.message; }
  state.busy = false;
  await load();
  document.getElementById('mine')?.scrollIntoView({ behavior:'smooth', block:'start' });
}

function grabForm(){

  box.selStart = active && active.selectionStart != null ? active.selectionStart : null;

    wireForm();
  }
  fillMedia();
  putForm(keep);
  tick();
}

function wireForm(){
  const f = document.getElementById('file'), drop = document.getElementById('drop');
  if(f){
    f.addEventListener('change', e => pickFile(e.target.files[0]));
    drop.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); f.click(); } });
    ['dragenter','dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('on'); }));
    ['dragleave','drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('on'); }));
    drop.addEventListener('drop', e => pickFile(e.dataTransfer.files[0]));
  }
  document.getElementById('goBtn').addEventListener('click', submit);
}

modeBtn.addEventListener('click', () => { state.mode = state.mode === 'desk' ? 'ask' : 'desk'; state.error=''; render(); });
</script>
</body>
